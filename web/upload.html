<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload a video</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  label { display: block; margin-bottom: 1rem; }
  input, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: .25rem; padding: .5rem; font: inherit; }
  progress { width: 100%; }
</style>
</head>
<body>
<h1>Upload a video</h1>
<p><a href="/">Back to videos</a></p>
<form id="form">
  <label>Title <input name="title" required></label>
  <label>Description <textarea name="description" rows="3"></textarea></label>
  <label>Video <input name="file" type="file" accept="video/*" required></label>
  <button id="submit">Upload</button>
</form>
<p><progress id="progress" max="100" value="0" hidden></progress></p>
<p id="status" role="status"></p>
<script>
const form = document.getElementById('form');
const submit = document.getElementById('submit');
const progress = document.getElementById('progress');
const status = document.getElementById('status');

// fetch cannot report upload progress, so the PUT uses XMLHttpRequest.
function put(url, headers, file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    for (const [name, value] of Object.entries(headers)) xhr.setRequestHeader(name, value);
    xhr.upload.onprogress = e => { progress.value = e.loaded / e.total * 100; };
    xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(`upload failed (${xhr.status})`));
    xhr.onerror = () => reject(new Error('upload failed: could not reach storage'));
    xhr.send(file);
  });
}

// The file goes straight to the bucket and never passes through the API.
form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(form);
  const file = data.get('file');
  submit.disabled = true;
  try {
    status.textContent = 'Saving…';
    const res = await fetch('/videos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: data.get('title'),
        description: data.get('description'),
        filename: file.name,
        content_type: file.type,
        size_bytes: file.size,
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    status.textContent = 'Uploading…';
    progress.hidden = false;
    await put(body.upload_url, body.upload_headers, file);
    location.href = '/';
  } catch (err) {
    status.textContent = err.message;
    submit.disabled = false;
  }
});
</script>
</body>
</html>
