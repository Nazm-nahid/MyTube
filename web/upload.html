<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload · niga club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 26'%3E%3Crect width='36' height='26' rx='6' fill='%235a3222'/%3E%3Ccircle cx='16' cy='13' r='8.5' fill='%23ff7eb6'/%3E%3Cpath d='M13 8.5v9l7-4.5z' fill='%231c0f0a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 36 26" aria-hidden="true"><rect width="36" height="26" rx="6" fill="#5a3222"/><circle cx="16" cy="13" r="8.5" fill="#ff7eb6"/><path d="M13 8.5v9l7-4.5z" fill="#1c0f0a"/></svg>
      <b>niga <span>club</span></b>
    </a>
    <div class="nav-actions"><div class="account" id="account"></div></div>
  </div>
</header>
<main class="narrow">
  <section class="hero">
    <h1>Upload a <em>video</em></h1>
    <p>Your video is ready to watch as soon as it finishes uploading.</p>
  </section>
  <section class="panel signin" id="signin" hidden>
    <h2>Sign in to upload</h2>
    <p>Anyone can watch, but you need an account to share a video.</p>
    <a class="button google" id="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.9 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.9c-.6 3-2.2 5.5-4.8 7.2l7.7 6c4.5-4.2 7.1-10.3 7.1-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.7-6c-2.1 1.4-4.8 2.3-7.8 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </a>
  </section>
  <form class="panel" id="form" hidden>
    <label class="drop" id="drop">
      <input name="file" id="file" type="file" accept="video/*" required>
      <strong id="file-name">Choose a video or drop it here</strong>
      <small id="file-hint">Up to 5 GB</small>
    </label>
    <label class="field">Title <input name="title" required></label>
    <label class="field">Description <textarea name="description" rows="3"></textarea></label>
    <button class="button" id="submit">Upload</button>
    <div class="progress" id="progress" hidden>
      <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
    </div>
    <p class="status" id="status" role="status"></p>
  </form>
</main>
<script src="/app.js"></script>
<script>
const form = document.getElementById('form');
const submit = document.getElementById('submit');
const progress = document.getElementById('progress');
const bar = document.getElementById('bar');
const status = document.getElementById('status');
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const signin = document.getElementById('signin');

document.getElementById('google').href = signInURL();
currentUser.then(user => {
  form.hidden = !user;
  signin.hidden = !!user;
});

function showFile() {
  const file = fileInput.files[0];
  document.getElementById('file-name').textContent = file ? file.name : 'Choose a video or drop it here';
  document.getElementById('file-hint').textContent = file ? `${(file.size / (1024 * 1024)).toFixed(1)} MB` : 'Up to 5 GB';
}

fileInput.addEventListener('change', showFile);
for (const name of ['dragenter', 'dragover']) drop.addEventListener(name, () => drop.classList.add('over'));
for (const name of ['dragleave', 'drop']) drop.addEventListener(name, () => drop.classList.remove('over'));

// fetch cannot report upload progress, so the PUT uses XMLHttpRequest.
function put(url, headers, file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    for (const [name, value] of Object.entries(headers)) xhr.setRequestHeader(name, value);
    xhr.upload.onprogress = e => {
      const percent = Math.round(e.loaded / e.total * 100);
      bar.style.width = `${percent}%`;
      status.textContent = `Uploading… ${percent}%`;
    };
    xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(`upload failed (${xhr.status})`));
    xhr.onerror = () => reject(new Error('upload failed: could not reach storage'));
    xhr.send(file);
  });
}

// The file goes straight to the bucket and never passes through the API.
form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(form);
  const file = data.get('file');
  submit.disabled = true;
  try {
    status.textContent = 'Saving…';
    const res = await fetch('/videos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: data.get('title'),
        description: data.get('description'),
        filename: file.name,
        content_type: file.type,
        size_bytes: file.size,
      }),
    });
    // The session ran out while this page was open.
    if (res.status === 401) {
      location.href = signInURL();
      return;
    }
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    status.textContent = 'Uploading…';
    progress.hidden = false;
    await put(body.upload_url, body.upload_headers, file);
    location.href = '/';
  } catch (err) {
    status.textContent = err.message;
    submit.disabled = false;
  }
});
</script>
</body>
</html>
