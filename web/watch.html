<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch · niga club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 26'%3E%3Crect width='36' height='26' rx='6' fill='%235a3222'/%3E%3Ccircle cx='16' cy='13' r='8.5' fill='%23ff7eb6'/%3E%3Cpath d='M13 8.5v9l7-4.5z' fill='%231c0f0a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 36 26" aria-hidden="true"><rect width="36" height="26" rx="6" fill="#5a3222"/><circle cx="16" cy="13" r="8.5" fill="#ff7eb6"/><path d="M13 8.5v9l7-4.5z" fill="#1c0f0a"/></svg>
      <b>niga <span>club</span></b>
    </a>
    <div class="nav-actions"><div class="account" id="account"></div><a class="button" href="/upload.html">Upload</a></div>
  </div>
</header>
<main>
  <div class="stage" id="stage"><video id="player" controls></video></div>
  <h1 class="watch-title" id="title">Video</h1>
  <p class="status" id="status" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script src="/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const player = document.getElementById('player');
const status = document.getElementById('status');

document.getElementById('title').textContent = params.get('title') || 'Video';

function fail(message) {
  document.getElementById('stage').hidden = true;
  status.textContent = message;
}

function playHls(url) {
  const hls = new Hls();
  hls.on(Hls.Events.FRAG_LOADED, () => { status.textContent = ''; });
  hls.on(Hls.Events.ERROR, (_, data) => {
    if (!data.fatal) return;
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
      status.textContent = 'Connection lost. Retrying…';
      setTimeout(() => hls.startLoad(), 3000);
    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
      hls.recoverMediaError();
    } else {
      fail('This video could not be loaded.');
    }
  });
  hls.loadSource(url);
  hls.attachMedia(player);
}

async function load() {
  try {
    const res = await fetch(`/videos/${encodeURIComponent(params.get('id'))}/stream`);
    const body = await res.json();
    if (!res.ok) throw new Error(res.status === 404 ? 'This video was never uploaded.' : body.error);
    // Prefer hls.js even where HLS is native, as in recent Chrome, because the
    // native player gives up on the first network error.
    if (body.format === 'hls' && Hls.isSupported()) {
      playHls(body.stream_url);
    } else {
      player.onerror = () => fail('This browser cannot play this video format.');
      player.src = body.stream_url;
    }
  } catch (err) {
    fail(err.message);
  }
}

load();
</script>
</body>
</html>
