<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch video</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
  video { width: 100%; background: #000; }
</style>
</head>
<body>
<h1 id="title">Video</h1>
<p><a href="/">Back to videos</a></p>
<video id="player" controls></video>
<p id="status" role="status"></p>
<script>
const params = new URLSearchParams(location.search);
const player = document.getElementById('player');
const status = document.getElementById('status');

document.getElementById('title').textContent = params.get('title') || 'Video';

function fail(message) {
  player.hidden = true;
  status.textContent = message;
}

async function load() {
  try {
    const res = await fetch(`/videos/${encodeURIComponent(params.get('id'))}/stream`);
    const body = await res.json();
    if (!res.ok) throw new Error(res.status === 404 ? 'This video was never uploaded.' : body.error);
    player.onerror = () => fail('This browser cannot play this video format.');
    player.src = body.stream_url;
  } catch (err) {
    fail(err.message);
  }
}

load();
</script>
</body>
</html>
